neighbor_selection:
  enabled: true
  max_active_neighbors: 2
  evaluation_interval_seconds: 1.0
  stale_timeout_seconds: 3.5

  scoring_weights:
    rssi_weight: 0.40
    latency_weight: 0.35
    packet_loss_weight: 0.15
    snr_weight: 0.10

  hard_boundaries:
    min_rssi_dbm: -85.0
    max_latency_ms: 100.0
    max_packet_loss_percent: 10.0

  normalization_bounds:
    rssi_min_dbm: -95.0
    rssi_max_dbm: -45.0
    latency_min_ms: 1.0
    latency_max_ms: 50.0
    snr_min_db: 10.0
    snr_max_db: 40.0
