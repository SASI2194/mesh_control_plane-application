# ===============================================================================
# Mesh Control Plane - Master AP Election & Failover Configuration
# File: config/failover.yaml
# ===============================================================================

failover:

  # Base switching interval (seconds) for Priority 1 Master AP (default: 30.0s)
  base_switching_interval_seconds: 30.0

  # Staggered interval increment (seconds) added for each lower priority rank
  # Prevents phase-lock synchronization when multiple isolated devices probe simultaneously.
  # Calculation: interval = base_switching_interval + (priority_rank * stagger_increment)
  priority_stagger_increment_seconds: 10.0

  # Node application heartbeat offline timeout threshold (seconds)
  # Provides blackout buffer during RF hardware mode switch role handovers
  node_offline_timeout_seconds: 60.0

  # Priority queue for Master AP election hierarchy (highest priority first)
  # When primary Master AP (GCS-01 / UGV-01) drops offline, the first online candidate
  # in this priority list is elected as the new Master AP.
  device_priority:
    - GCS-01
    - GCS-02
    - GCS-03
    - UGV-01
    - UGV-02
    - UGV-03
    - UGV-04
    - UGV-05
    - UGV-06

  # Full Mesh Device Node Registry & Hardware Mapping Table
  # Links Device ID, Name, Type, Host IP, NetMetal AX Radio IP, Role, and Probe Interval
  device_nodes:
    GCS-01:
      name: "GCS Primary Command"
      type: "GCS"
      host_ip: "192.168.3.71"
      radio_ip: "192.168.3.8"
      role: "Primary Coordinator"
      switching_interval_seconds: 30.0

    GCS-02:
      name: "GCS Tactical Station 1"
      type: "GCS"
      host_ip: "192.168.3.72"
      radio_ip: "192.168.3.8"
      role: "Tactical Monitor"
      switching_interval_seconds: 40.0

    GCS-03:
      name: "GCS Tactical Station 2"
      type: "GCS"
      host_ip: "192.168.3.73"
      radio_ip: "192.168.3.8"
      role: "Backup Command"
      switching_interval_seconds: 50.0

    UGV-01:
      name: "UGV Unit 01"
      type: "UGV"
      host_ip: "192.168.3.65"
      radio_ip: "192.168.3.3"
      role: "Mesh Node"
      switching_interval_seconds: 30.0

    UGV-02:
      name: "UGV Unit 02"
      type: "UGV"
      host_ip: "192.168.3.66"
      radio_ip: "192.168.3.4"
      role: "Field Unit"
      switching_interval_seconds: 40.0

    UGV-03:
      name: "UGV Unit 03"
      type: "UGV"
      host_ip: "192.168.3.67"
      radio_ip: "192.168.3.2"
      role: "Field Unit"
      switching_interval_seconds: 50.0

    UGV-04:
      name: "UGV Unit 04"
      type: "UGV"
      host_ip: "192.168.3.68"
      radio_ip: "192.168.3.5"
      role: "Field Unit"
      switching_interval_seconds: 60.0

    UGV-05:
      name: "UGV Unit 05"
      type: "UGV"
      host_ip: "192.168.3.69"
      radio_ip: "192.168.3.6"
      role: "Field Unit"
      switching_interval_seconds: 70.0

    UGV-06:
      name: "UGV Unit 06"
      type: "UGV"
      host_ip: "192.168.3.70"
      radio_ip: "192.168.3.7"
      role: "Field Unit"
      switching_interval_seconds: 80.0
